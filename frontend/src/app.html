<!doctype html>
<html lang="%lang%" data-theme="%theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d1020" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/icons/icon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
