name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  api:
    name: API (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anycardz
          POSTGRES_PASSWORD: anycardz
          POSTGRES_DB: anycardz_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U anycardz" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://anycardz:anycardz@127.0.0.1:5433/anycardz_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Web (check, lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx prettier --check src e2e
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: anycardz
          POSTGRES_PASSWORD: anycardz
          POSTGRES_DB: anycardz
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U anycardz" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://anycardz:anycardz@127.0.0.1:5433/anycardz
      ANYCARDZ_DATA: ${{ github.workspace }}/anycardz-data
      ANYCARDZ_CACHE: ${{ github.workspace }}/cache
      ANYCARDZ_RELAXED_LIMITS: '1'
      RUST_LOG: warn
    steps:
      - uses: actions/checkout@v4
      # The card data lives in its own repository
      - uses: actions/checkout@v4
        with:
          repository: ef3d0c3e/anycardz-data
          path: anycardz-data
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p anycardz-api
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Playwright starts the API (cargo run) and the dev server itself
      - run: npm run test:e2e
        working-directory: frontend
        env:
          CI: '1'
          # Production build instead of the dev server: steadier timings
          E2E_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7
