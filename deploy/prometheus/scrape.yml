# Add to the scrape_configs of your Prometheus. The API serves /metrics on
# ANYCARDZ_METRICS_BIND (compose.prod.yaml publishes it on METRICS_PUBLISH).
scrape_configs:
  - job_name: anycardz
    scrape_interval: 30s
    # Same value as METRICS_TOKEN in .env.prod; remove when no token is set
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/anycardz.token
    static_configs:
      - targets: ['anycardz.example.org:9100']
