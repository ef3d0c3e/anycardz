# AnyCardz behind nginx on the host, with deploy/compose.nginx.yaml.
# Copy to /etc/nginx/sites-available/anycardz (or conf.d/anycardz.conf), replace
# anycardz.example.org, then: nginx -t && systemctl reload nginx
# Certificates: certbot --nginx -d anycardz.example.org (or any ACME client).

# The live feed is a WebSocket under /api/live
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream anycardz_api { server 127.0.0.1:8080; keepalive 16; }
upstream anycardz_web { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name anycardz.example.org;
    # certbot's HTTP challenge, then everything to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name anycardz.example.org;

    ssl_certificate     /etc/letsencrypt/live/anycardz.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anycardz.example.org/privkey.pem;

    # Avatars are up to 4 MB
    client_max_body_size 5m;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Every location sets all its headers: nginx drops the server-level
    # proxy_set_header lines in a location that has any of its own, and then
    # a client's own X-Forwarded-For would pass through untouched
    proxy_http_version 1.1;

    location /api/ {
        proxy_pass http://anycardz_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The live socket stays open; the API pings it
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Unversioned static files: reused for a week. The app's own chunks are
    # hashed and immutable already; the service worker is left uncached.
    location ~ ^/(favicon\.ico|robots\.txt|manifest\.webmanifest|icons/) {
        proxy_pass http://anycardz_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://anycardz_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
