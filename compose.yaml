# Development services. The API and the frontend run on the host (make dev).
# A project of its own: on a machine that also runs production (project
# "anycardz"), this file can never replace its containers.
name: anycardz-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: anycardz
      POSTGRES_PASSWORD: anycardz
      POSTGRES_DB: anycardz
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anycardz"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  db-data:
